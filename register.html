<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Smart Emergency</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #b30000;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #b30000;
        }

        .register-button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #b30000;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            background: #8f0000;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .login-link a {
            color: #b30000;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 18px;
        }

        .back-home a {
            color: #555;
            text-decoration: none;
        }

        @media (max-width: 500px) {

            .register-card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="register-card">

        <div class="logo">
            🚨
        </div>

        <h1>
            Create Account
        </h1>

        <p class="subtitle">
            Join Smart Emergency Alert System
        </p>

        <form id="registerForm">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >

            <button
                type="submit"
                class="register-button">

                Create Account

            </button>

        </form>

        <p id="message"></p>

        <div class="login-link">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

        <div class="back-home">

            <a href="/">
                ← Back to Home
            </a>

        </div>

    </div>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();

                    const name =
                        document
                            .getElementById("name")
                            .value
                            .trim();

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById("password")
                            .value;

                    const message =
                        document
                            .getElementById("message");


                    message.innerText =
                        "⏳ Creating your account...";


                    try {

                        const response =
                            await fetch(
                                "/register",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            name: name,
                                            email: email,
                                            password: password
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        if (data.success) {

                            message.style.color =
                                "green";

                            message.innerText =
                                "✅ Registration successful! Redirecting to login...";


                            setTimeout(
                                function() {

                                    window.location.href =
                                        "/login";

                                },
                                1500
                            );

                        } else {

                            message.style.color =
                                "#b30000";

                            message.innerText =
                                "❌ " +
                                data.message;

                        }

                    } catch (error) {

                        console.error(error);

                        message.style.color =
                            "#b30000";

                        message.innerText =
                            "❌ Server error. Please try again.";

                    }

                }
            );

    </script>

</body>

</html>
